name: Main Kittygram workflow # Название процесса в GitHub Actions

on: # Триггеры запуска
  push: # Запускать при пуше кода
    branches:
      - "*"

jobs: # Список задач (jobs)
  tests: # Job 1: Тестирование кода
    runs-on: ubuntu-latest
    strategy:
      matrix: # Матрица стратегий: запускаем тесты параллельно на разных версиях Python
        python-version: ["3.10", "3.11", "3.12"]

    services: # Дополнительные сервисы для тестов (база данных)
      postgres:
        image: postgres:13 # Образ PostgreSQL версии 13
        env: # Переменные окружения для БД
          POSTGRES_USER: kittygram_user
          POSTGRES_PASSWORD: kittygram_password
          POSTGRES_DB: kittygram
        ports:
          - 5432:5432 # Проброс порта для доступа к БД из теста
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5 # Ждем готовности БД перед запуском тестов

    steps: # Шаги выполнения job'а tests
      - uses: actions/checkout@v4 # Скачиваем код репозитория на виртуальную машину
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }} # Устанавливаем нужную версию Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }} # Берем версию из матрицы (3.10, 3.11 или 3.12)
          cache: "pip"

      - name: Install dependencies # Устанавливаем библиотеки проекта
        run: |
          python -m pip install --upgrade pip # Обновляем pip
          pip install -r backend/requirements.txt # Ставим всё из requirements.txt

      - name: Check backend with ruff # Проверка стиля кода линтером ruff
        run: ruff check backend/

      - name: Test with pytest # Запуск тестов Django
        env: # Переменные окружения для тестового запуска
          POSTGRES_DB: kittygram
          POSTGRES_USER: kittygram_user
          POSTGRES_PASSWORD: kittygram_password
          DB_ENGINE: django.db.backends.postgresql
          DB_HOST: localhost
          DJANGO_SETTINGS_MODULE: kittygram_backend.settings
        run: |
          python backend/manage.py migrate # Применяем миграции к тестовой БД
          python backend/manage.py test # Запускаем тесты

      - name: Run frontend tests # Запуск тестов фронтенда (React)
        run: |
          cd frontend # Переходим в папку фронтенда
          npm ci # Устанавливаем зависимости Node.js
          npm test # Запускаем тесты фронтенда

  build_and_push: # Сборка Docker-образов и отправка на Docker Hub
    needs: tests # Этот job запускается ТОЛЬКО если job 'tests' прошел успешно
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # И ТОЛЬКО если пуш был сделан в ветку main

    steps:
      - name: Checkout code # Снова скачиваем код (контекст предыдущего job'а не сохраняется)
        uses: actions/checkout@v4

      - name: Set up Docker Buildx # Настраиваем инструмент для сборки образов
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub # Логинимся в Docker Hub используя секреты
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }} # Логин из Secrets репозитория
          password: ${{ secrets.DOCKER_PASSWORD }} # Пароль/Токен из Secrets репозитория

      - name: Build and push backend # Собираем и пушим образ бэкенда
        uses: docker/build-push-action@v5
        with:
          context: ./backend/ # Путь к Dockerfile бэкенда
          push: true # Флаг для отправки образа в реестр
          tags: ${{ secrets.DOCKER_USERNAME }}/kittygram_backend:latest

      - name: Build and push frontend # Собираем и пушим образ фронтенда
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kittygram_frontend:latest

      - name: Build and push gateway # Собираем и пушим образ nginx
        uses: docker/build-push-action@v5
        with:
          context: ./nginx/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kittygram_gateway:latest

  send_message: # Отправка уведомления в Telegram
    needs: build_and_push # Запускается только после успешной сборки образов
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram message # Отправляем POST-запрос к API Telegram
        run: |
          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d parse_mode=HTML \
          -d text="<b>Деплой Kittygram успешен!</b>%0A<b> Автор:</b> ${{ github.actor }}%0A<b> Коммит:</b> $(echo '${{ github.event.commits[0].message }}' | sed 's/[<>]/_/g')%0A<b> Ссылка:</b> https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
